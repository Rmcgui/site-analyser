<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SiteAnalyser architecture diagram</title>
<desc>Flow diagram showing the SiteAnalyser architecture: Next.js frontend on Netlify, ASP.NET Core API on Azure App Service, connecting to Google PageSpeed, OpenAI, and Supabase Postgres.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .th { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #1e293b; }
    .ts { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #475569; }
    .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<!-- Row 1: Frontend -->
<rect x="220" y="40" width="240" height="64" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text class="th" x="340" y="65" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Next.js frontend</text>
<text class="ts" x="340" y="84" text-anchor="middle" dominant-baseline="central" fill="#534AB7">React 19 · TypeScript · Tailwind · Netlify</text>

<!-- Arrow: Frontend → API -->
<line x1="340" y1="104" x2="340" y2="148" stroke="#7F77DD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="356" y="130" dominant-baseline="central" fill="#475569">POST /api/audit</text>

<!-- Arrow: API → Frontend -->
<line x1="324" y1="148" x2="324" y2="104" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="130" dominant-baseline="central" text-anchor="middle" fill="#475569">scores + stream</text>

<!-- Row 2: API -->
<rect x="180" y="148" width="320" height="72" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central" fill="#085041">ASP.NET Core Web API</text>
<text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">C# · .NET 10 · Azure App Service F1</text>
<text class="ts" x="340" y="210" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">AuditController · SummaryController · HistoryController</text>

<!-- Arrows: API → External services -->
<line x1="230" y1="220" x2="110" y2="310" stroke="#EF9F27" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="220" x2="340" y2="310" stroke="#EF9F27" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="450" y1="220" x2="570" y2="310" stroke="#EF9F27" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- PageSpeed -->
<rect x="30" y="310" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text class="th" x="120" y="334" text-anchor="middle" dominant-baseline="central" fill="#633806">Google PageSpeed</text>
<text class="ts" x="120" y="352" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Lighthouse scores + CWV</text>

<!-- OpenAI -->
<rect x="250" y="310" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text class="th" x="340" y="334" text-anchor="middle" dominant-baseline="central" fill="#633806">OpenAI</text>
<text class="ts" x="340" y="352" text-anchor="middle" dominant-baseline="central" fill="#854F0B">gpt-4o-mini · streaming</text>

<!-- Supabase -->
<rect x="470" y="310" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text class="th" x="560" y="334" text-anchor="middle" dominant-baseline="central" fill="#633806">Supabase Postgres</text>
<text class="ts" x="560" y="352" text-anchor="middle" dominant-baseline="central" fill="#854F0B">EF Core · audit history</text>

<!-- Divider -->
<line x1="40" y1="420" x2="640" y2="420" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="40" y="442" dominant-baseline="central" fill="#5F5E5A">CI / CD</text>

<!-- GitHub Actions -->
<rect x="100" y="432" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="190" y="452" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">GitHub Actions</text>
<text class="ts" x="190" y="468" text-anchor="middle" dominant-baseline="central" fill="#444441">build · test · deploy on push</text>

<!-- Arrow: GHA → Azure -->
<line x1="280" y1="456" x2="380" y2="456" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- Azure App Service -->
<rect x="380" y="432" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="470" y="452" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Azure App Service</text>
<text class="ts" x="470" y="468" text-anchor="middle" dominant-baseline="central" fill="#444441">Linux · F1 free · OIDC auth</text>

<!-- Legend -->
<rect x="40" y="500" width="12" height="12" rx="2" fill="#AFA9EC"/>
<text class="ts" x="58" y="509" dominant-baseline="central" fill="#475569">Frontend</text>
<rect x="140" y="500" width="12" height="12" rx="2" fill="#5DCAA5"/>
<text class="ts" x="158" y="509" dominant-baseline="central" fill="#475569">API</text>
<rect x="210" y="500" width="12" height="12" rx="2" fill="#EF9F27"/>
<text class="ts" x="228" y="509" dominant-baseline="central" fill="#475569">External services</text>
<rect x="360" y="500" width="12" height="12" rx="2" fill="#B4B2A9"/>
<text class="ts" x="378" y="509" dominant-baseline="central" fill="#475569">Infrastructure</text>
</svg>
